# Conformed dimensions (spec §5, D11). history: scd4 (default) | scd1 | scd2 (needs scd2_reason).
# Attribute history: historical (resolved in DWD at event time) | current (read from dim_*).
dimensions:
  - name: date
    scope: pub
    description: Calendar day in the Asia/Ho_Chi_Minh calendar. Mandatory as dim_pub_date.
    natural_key: [cal_date]
    history: scd1
    attributes:
      - name: year
        description: Calendar year.
        history: current
      - name: month
        description: Calendar month, 1-12.
        history: current
      - name: weekday
        description: ISO day of week, 1 = Monday.
        history: current
  - name: customer
    scope: pub
    description: A person who buys from the shops. Shared by every domain.
    natural_key: [customer_id]
    history: scd4
    attributes:
      - name: customer_name
        description: Display name of the customer.
        history: current
      - name: city
        description: City of the customer when the fact happened.
        history: historical
  - name: shop
    scope: trade
    description: A shop that sells on the platform.
    natural_key: [shop_id]
    history: scd1
    attributes:
      - name: shop_name
        description: Display name of the shop.
        history: current
      - name: city
        description: City of the shop.
        history: current
