name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make lint

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: make image
      - run: make dev-up
      - run: make smoke
      - run: make test-dags
      - run: make test-integration
      - run: make e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f dev/compose.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: make dev-down
