name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make lint
      - run: make sql-lint
      - run: make test-repo
      - run: make dwh-test
      - run: make validate
      - run: make dwh-lint
      - run: make check-standards
      - run: make sync-agents-check

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make image
      - run: make dev-up
      - run: make smoke
      - run: make test-dags
      - run: make test-integration
      - run: make e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f dev/compose.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: make dev-down
