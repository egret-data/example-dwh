[project]
name = "example-dwh"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["dags", "tests", "tools/dwh/src", "tools/dwh/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["_common", "dwh", "fixtures"]
