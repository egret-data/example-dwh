version: 2

models:
  - name: ods_shop_orders_di
    description: "Daily increment of shop.orders: rows whose updated_at falls on dt. Grain: one row per order per dt."
    columns:
      - name: order_id
        description: Order id from the source.
        data_type: bigint
        data_tests: [not_null]
      - name: shop_id
        description: Shop that took the order, from the source.
        data_type: bigint
      - name: channel
        description: Sales channel of the order (app or web), from the source.
        data_type: varchar
      - name: dt
        description: Partition date (the day the row changed).
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, dt]

  - name: ods_shop_customers_df
    description: "Daily full copy of shop.customers. Grain: one row per customer per dt."
    columns:
      - name: customer_id
        description: Customer id from the source.
        data_type: bigint
        data_tests: [not_null]
      - name: dt
        description: Partition date (snapshot day).
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_id, dt]

  - name: ods_shop_shops_df
    description: "Daily full copy of shop.shops. Grain: one row per shop per dt."
    columns:
      - name: shop_id
        description: Shop id from the source.
        data_type: bigint
        data_tests: [not_null]
      - name: dt
        description: Partition date (snapshot day).
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [shop_id, dt]

  - name: ods_shop_payments_di
    description: "Daily increment of shop.payments: rows whose updated_at falls on dt. Grain: one row per payment per dt."
    columns:
      - name: payment_id
        description: Payment id from the source (a varchar, unlike the other ids).
        data_type: varchar
        data_tests: [not_null]
      - name: order_id
        description: Order the payment is for, from the source.
        data_type: bigint
      - name: dt
        description: Partition date (the day the payment was recorded).
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [payment_id, dt]
